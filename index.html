<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OTTv2 — Oẳn Tù Tì</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(15, 23, 42, .78);
      --p1: #14b8a6;
      --p2: #f43f5e;
      --goal: #fbbf24;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(20,184,166,.18), transparent 50%),
        radial-gradient(900px 500px at 100% 110%, rgba(244,63,94,.16), transparent 50%),
        var(--bg);
    }
    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 16px 32px;
      display: grid;
      gap: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 1.25rem; letter-spacing: .04em; }
    h1 span { color: var(--p1); }
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr 240px;
      gap: 16px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(10px);
    }
    .player { display: flex; flex-direction: column; gap: 10px; }
    .player.p1 { box-shadow: inset 3px 0 0 var(--p1); }
    .player.p2 { box-shadow: inset 3px 0 0 var(--p2); }
    .name { font-weight: 800; }
    .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .count {
      text-align: center;
      background: rgba(255,255,255,.04);
      border-radius: 10px;
      padding: 8px 4px;
    }
    .count b { display: block; font-size: 1.1rem; }
    .board-wrap { position: relative; }
    .coords {
      display: grid;
      grid-template-columns: 24px 1fr;
      grid-template-rows: 1fr 24px;
      gap: 6px;
    }
    .files, .ranks {
      display: grid;
      font-family: "JetBrains Mono", monospace;
      color: var(--muted);
      font-size: 12px;
    }
    .files { grid-template-columns: repeat(9, 1fr); text-align: center; }
    .ranks { grid-template-rows: repeat(9, 1fr); align-items: center; text-align: center; }
    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 3px;
      padding: 10px;
      background: #0f172a;
      border-radius: 16px;
      box-shadow: 0 24px 50px rgba(0,0,0,.4);
    }
    .cell {
      aspect-ratio: 1;
      border-radius: 8px;
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
    }
    .cell.light { background: #334155; }
    .cell.dark { background: #1e293b; }
    .cell.goal { box-shadow: inset 0 0 0 2px var(--goal); }
    .cell.selected { outline: 2px solid #fff; outline-offset: -2px; }
    .cell.valid::after {
      content: "";
      width: 12px; height: 12px;
      border-radius: 50%;
      background: rgba(20,184,166,.85);
    }
    .cell.attack::after {
      content: "";
      width: 70%; height: 70%;
      border: 3px solid rgba(244,63,94,.9);
      border-radius: 50%;
      background: transparent;
      position: absolute;
    }
    .piece {
      width: 78%; height: 78%;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: clamp(16px, 3vw, 28px);
      box-shadow: 0 8px 16px rgba(0,0,0,.35);
      z-index: 1;
    }
    .piece.P1 { background: radial-gradient(circle at 30% 25%, #5eead4, #0f766e); }
    .piece.P2 { background: radial-gradient(circle at 30% 25%, #fda4af, #9f1239); }
    .turn-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 999px;
      background: rgba(255,255,255,.06); font-weight: 600;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.P1 { background: var(--p1); }
    .dot.P2 { background: var(--p2); }
    .log {
      height: 180px; overflow: auto; font-size: 13px; color: var(--muted);
      display: flex; flex-direction: column-reverse; gap: 6px;
    }
    button {
      width: 100%; margin-top: 10px; border: 0; border-radius: 10px;
      padding: 10px; font-weight: 700; cursor: pointer;
      background: #1d4ed8; color: white;
    }
    .overlay {
      position: fixed; inset: 0; display: none; place-items: center;
      background: rgba(2,6,23,.72); z-index: 20;
    }
    .overlay.show { display: grid; }
    .modal {
      background: #0f172a; border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px; padding: 24px; max-width: 420px; text-align: center;
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>OTT<span>v2</span> — Oẳn Tù Tì trên bàn 9×9</h1>
      <div id="turnBadge" class="turn-badge"><span class="dot P1"></span> Lượt Xanh</div>
    </header>

    <div class="layout">
      <aside class="panel player p2">
        <div class="name" style="color:var(--p2)">Người chơi 2 — Đỏ</div>
        <div>Đích: ô <b>a1</b></div>
        <div class="counts" id="countsP2"></div>
      </aside>

      <main class="board-wrap">
        <div class="coords">
          <div class="ranks" id="ranks"></div>
          <div class="board" id="board"></div>
          <div></div>
          <div class="files" id="files"></div>
        </div>
      </main>

      <aside class="panel">
        <div class="player p1" style="box-shadow:none;padding:0">
          <div class="name" style="color:var(--p1)">Người chơi 1 — Xanh</div>
          <div>Đích: ô <b>i9</b></div>
          <div class="counts" id="countsP1"></div>
        </div>
        <h3>Nhật ký</h3>
        <div class="log" id="log"></div>
        <button id="resetBtn">Ván mới</button>
      </aside>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="winTitle">Kết thúc</h2>
      <p id="winReason"></p>
      <button id="playAgain">Chơi lại</button>
    </div>
  </div>

  <script type="module">
    import {
      COLS, ICONS, NAMES,
      createInitialBoard, getValidMovesForPiece, countPieces, applyMove
    } from "./gameLogic.js";

    const state = {
      board: createInitialBoard(),
      turn: "P1",
      winner: null,
      winReason: null,
      selected: null,
      log: ["Bắt đầu ván mới. Xanh đi trước."]
    };

    const boardEl = document.getElementById("board");
    const filesEl = document.getElementById("files");
    const ranksEl = document.getElementById("ranks");
    const overlay = document.getElementById("overlay");

    filesEl.innerHTML = COLS.map((c) => `<span>${c}</span>`).join("");
    ranksEl.innerHTML = Array.from({ length: 9 }, (_, i) => `<span>${9 - i}</span>`).join("");

    function coord(r, c) {
      return `${COLS[c]}${9 - r}`;
    }

    function reset() {
      state.board = createInitialBoard();
      state.turn = "P1";
      state.winner = null;
      state.winReason = null;
      state.selected = null;
      state.log = ["Bắt đầu ván mới. Xanh đi trước."];
      overlay.classList.remove("show");
      render();
    }

    function renderCounts() {
      const counts = countPieces(state.board);
      for (const who of ["P1", "P2"]) {
        document.getElementById("counts" + who).innerHTML = ["rock", "paper", "scissors"]
          .map((t) => `<div class="count">${ICONS[t]}<b>${counts[who][t]}</b>${NAMES[t]}</div>`)
          .join("");
      }
    }

    function render() {
      const moves = state.selected
        ? getValidMovesForPiece(state.board, state.selected.r, state.selected.c)
        : [];
      const moveMap = new Map(moves.map((m) => [`${m.r},${m.c}`, m.type]));

      boardEl.innerHTML = "";
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const cell = document.createElement("div");
          const isLight = (r + c) % 2 === 0;
          cell.className = `cell ${isLight ? "light" : "dark"}`;
          if ((r === 8 && c === 0) || (r === 0 && c === 8)) cell.classList.add("goal");
          if (state.selected?.r === r && state.selected?.c === c) cell.classList.add("selected");
          const mt = moveMap.get(`${r},${c}`);
          if (mt === "move") cell.classList.add("valid");
          if (mt === "attack") cell.classList.add("attack");

          const piece = state.board[r][c];
          if (piece) {
            const p = document.createElement("div");
            p.className = `piece ${piece.owner}`;
            p.textContent = ICONS[piece.type];
            cell.appendChild(p);
          }
          cell.onclick = () => onClick(r, c);
          boardEl.appendChild(cell);
        }
      }

      const isP1 = state.turn === "P1";
      document.getElementById("turnBadge").innerHTML =
        `<span class="dot ${state.turn}"></span> Lượt ${isP1 ? "Xanh" : "Đỏ"}`;
      document.getElementById("log").innerHTML = state.log.map((l) => `<div>${l}</div>`).join("");
      renderCounts();

      if (state.winner) {
        document.getElementById("winTitle").textContent =
          state.winner === "P1" ? "Xanh thắng" : "Đỏ thắng";
        document.getElementById("winReason").textContent = state.winReason;
        overlay.classList.add("show");
      }
    }

    function onClick(r, c) {
      if (state.winner) return;
      const piece = state.board[r][c];
      if (!state.selected) {
        if (piece && piece.owner === state.turn) state.selected = { r, c };
        render();
        return;
      }
      if (state.selected.r === r && state.selected.c === c) {
        state.selected = null;
        render();
        return;
      }
      if (piece && piece.owner === state.turn) {
        state.selected = { r, c };
        render();
        return;
      }

      const from = state.selected;
      const ok = applyMove(state, from.r, from.c, r, c);
      if (ok) {
        state.log.unshift(`${coord(from.r, from.c)} → ${coord(r, c)}`);
        state.selected = null;
      }
      render();
    }

    document.getElementById("resetBtn").onclick = reset;
    document.getElementById("playAgain").onclick = reset;
    render();
  </script>
</body>
</html>
